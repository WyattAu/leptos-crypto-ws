# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste unmaintained (dtolnay archived the repo; successors are pastey and
    # with_builtin_macros). Transitive-only: via the leptos stack (either_of,
    # reactive_graph, ...); no in-range upgrade exists and the migration
    # belongs upstream in leptos.
    # TODO: drop when leptos drops paste.
    "RUSTSEC-2024-0436",
    # proc-macro-error2 unmaintained (author confirms no further maintenance;
    # no released successor dependency yet). Transitive-only: via
    # leptos_macro / reactive_stores_macro <- leptos; no in-range upgrade.
    # TODO: drop when leptos migrates off proc-macro-error2.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # BSL-1.0 — permissive Boost license (ratified 2026-09); ships here via
  # xxhash-rust <- server_fn <- leptos (precedent: webhookkit).
  "BSL-1.0",
  # MPL-2.0 — weak file-level copyleft, linkable (ratified 2026-09);
  # cssparser/html5ever class (precedent: docs-pipeline).
  "MPL-2.0",
  # CC0-1.0 — public-domain dedication (ratified 2026-09); ships here via
  # base16 <- wasm_split_macros <- leptos (precedent: config-kit).
  "CC0-1.0",
  # 0BSD — public-domain-equative, no attribution requirement beyond the
  # notice (ratified 2026-09; precedent: mailkit).
  "0BSD",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
